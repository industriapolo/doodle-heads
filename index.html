<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>doodle-heads</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px;
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #17191c; color: #d6d9dc;
  }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  h1 { font-size: 14px; font-weight: 600; margin: 0 8px 0 0; letter-spacing: .05em; text-transform: uppercase; }
  button, select {
    background: #2c3036; color: #d6d9dc; border: 1px solid #3b4149; border-radius: 4px;
    padding: 6px 11px; font: inherit; font-size: 11px; cursor: pointer;
  }
  button:hover, select:hover { background: #363b42; }
  #fps { margin-left: auto; color: #6d7379; font-size: 11px; font-variant-numeric: tabular-nums; }
  /* Cards a hueso: sin gap, sin radio — con esquinas redondeadas asomarían rendijas de
     fondo entre celdas contiguas. El tamaño de celda puede variar; los huecos no.

     El canvas se dimensiona como una IMAGEN fluida: width 100% + height auto, y el
     cuadrado sale de su ratio intrínseco (width == height de atributo). Nada de
     aspect-ratio en CSS ni de height:100%: el canvas llegaba con width/height inline
     en px fijos (setupCanvas) y en columnas más estrechas que ese fijo desbordaba la
     celda y pisaba a las vecinas — ESE era el solape. El JS pisa el inline. */
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  .cell { position: relative; cursor: pointer; overflow: hidden; }
  .cell canvas { display: block; }
  .cell b {
    position: absolute; left: 5px; bottom: 5px; font-size: 9px; font-weight: 400;
    color: #fff; background: rgba(0,0,0,.5); padding: 2px 5px; border-radius: 2px;
    opacity: 0; transition: opacity .12s; pointer-events: none;
  }
  .cell:hover b { opacity: 1; }
  .cell .fav {
    position: absolute; right: 5px; top: 5px; font-size: 13px; line-height: 1;
    color: #fff; background: rgba(0,0,0,.5); padding: 3px 6px; border-radius: 2px;
    border: 0; cursor: pointer; opacity: 0; transition: opacity .12s;
  }
  .cell:hover .fav { opacity: 1; }
  .cell .fav.on { opacity: 1; color: #ffd34d; }
  /* Hermano de la ★ y no hijo de un contenedor común: la ★ guardada se queda visible sin
     hover (.fav.on) y desde dentro de un padre a opacity 0 no habría forma de sacarla. */
  .cell .again {
    position: absolute; right: 33px; top: 5px; font-size: 13px; line-height: 1;
    color: #fff; background: rgba(0,0,0,.5); padding: 3px 6px; border-radius: 2px;
    border: 0; cursor: pointer; opacity: 0; transition: opacity .12s;
  }
  .cell:hover .again { opacity: 1; }
  .cell .voz {
    position: absolute; right: 61px; top: 5px; font-size: 13px; line-height: 1;
    color: #fff; background: rgba(0,0,0,.5); padding: 3px 6px; border-radius: 2px;
    border: 0; cursor: pointer; opacity: 0; transition: opacity .12s;
  }
  .cell:hover .voz { opacity: 1; }
  .hint { color: #6d7379; font-size: 11px; margin: 14px 0 0; }
</style>

<header>
  <h1>doodle-heads</h1>
  <button id="regen">regenerar todos</button>
  <button id="pause">pausar</button>
  <button id="sonido">sonido: sí</button>
  <button id="saved">guardados: 0 · copiar</button>
  <select id="estilo" title="De dónde salen las bandas de estilo"></select>
  <span id="fps"></span>
</header>
<div id="grid"></div>
<p class="hint">Los treinta miran al puntero. Pasa el ratón por encima de uno y te presta
  atención; haz click y te contesta, con su propia voz. ♪ le busca otra voz sin tocarle la
  cara, ↻ le sortea una seed nueva, ★ lo guarda — «guardados · copiar» pone la lista en el
  portapapeles.</p>

<script type="module">
import { setupCanvas, clear, box, LOGICAL } from './src/core/canvas.js'
import { makeRng, randomSeed } from './src/core/prng.js'
import { makeCharacter, drawStatic, drawLive, paletteFor, SALT } from './src/core/character.js'
import { phrase } from './src/parts/voice.js'
import { createSpeech } from './src/anim/speech.js'
import { getPalette } from './src/style/palettes.js'
import { makeActor, startRig, overridesFor, react, lookAtAll } from './src/anim/rig.js'
import { drawSmoke } from './src/anim/smoke.js'
import { CONFIGS } from './previews/configs.js'

const COUNT = 30
const CELL = 320 // resolución de dibujo; el CSS lo escala al hueco del grid

// --- fuente de estilo -------------------------------------------------------
// El selector «estilo» dice de dónde salen las bandas, porque hay tres fuentes y la
// diferencia era invisible:
//   · composer  — lo último afinado en compose.html. OJO: vive en localStorage, que es
//     POR ORIGEN (localhost:8080 y :8137 son almacenes distintos) y se lee al cargar —
//     afinar en compose pide recargar el index.
//   · una configuración con nombre (previews/configs.js) — viaja con el repo, no
//     depende de origen ni de navegador. Fuente de verdad recomendada.
//   · por defecto — las bandas declaradas en cada módulo (composer vacío).
const ESTILO_KEY = 'doodle-estilo:index'
const estiloEl = document.getElementById('estilo')

// TALLER o DEMO. No es lo mismo abrir esto para trabajar que para mirarlo:
//
//  · el estilo «automático» (composer / por defecto) sale de lo que se haya afinado en
//    `compose.html`, que vive en localStorage y por tanto en ESTA máquina. A un visitante
//    no le dice nada y además le enseña la cara de fábrica en vez de la dirigida.
//  · el contador de fps es el juez de rendimiento mientras se trabaja; a quien solo mira,
//    un «0 fps» en reposo le parece que algo se ha roto.
//
// El taller es `localhost`; `127.0.0.1` es a propósito la vista de visitante, que es como
// se previsualiza en local (otro origen = otro localStorage, vacío). `?dev` fuerza taller
// desde donde sea, y `?debug` es su alias.
const PARAMS_URL = new URLSearchParams(location.search)
const DEV = PARAMS_URL.has('dev') || PARAMS_URL.has('debug')
const TALLER = location.hostname === 'localhost' || DEV

function composerBands() {
  try {
    return JSON.parse(localStorage.getItem('doodle-bands:compose') || '{}') || {}
  } catch {
    return {}
  }
}

function resolveBands(choice) {
  if (CONFIGS[choice]) return CONFIGS[choice].bands
  return composerBands()
}

const ESTILO_DEMO = 'poster-granulado'

{
  if (TALLER) {
    const auto = document.createElement('option')
    auto.value = ''
    estiloEl.append(auto)
  }
  for (const [n, c] of Object.entries(CONFIGS)) {
    const o = document.createElement('option')
    o.value = n
    o.textContent = `estilo: ${c.label || n}`
    estiloEl.append(o)
  }
  const saved = localStorage.getItem(ESTILO_KEY)
  // Sin elección guardada, el visitante ve la dirección de arte, no las bandas de
  // fábrica. En el taller se respeta lo de siempre: el automático primero, que es lo que
  // engancha el index con lo que se esté afinando en compose.
  if (saved !== null && (CONFIGS[saved] || (TALLER && saved === ''))) estiloEl.value = saved
  else if (!TALLER) estiloEl.value = ESTILO_DEMO
}

function syncAutoLabel() {
  const auto = estiloEl.options[0]
  if (!auto || auto.value !== '') return
  auto.textContent =
    Object.keys(composerBands()).length > 0 ? 'estilo: composer' : 'estilo: por defecto'
}
syncAutoLabel()

let bands = resolveBands(estiloEl.value)

function applyEstilo() {
  syncAutoLabel()
  bands = resolveBands(estiloEl.value)
  // mismas seeds, bandas nuevas: cambia el estilo sin cambiar de personajes
  for (const a of actors) reseed(a, a.seed)
}

estiloEl.addEventListener('change', () => {
  localStorage.setItem(ESTILO_KEY, estiloEl.value)
  applyEstilo()
})

// En modo composer, los retoques del panel tienen que llegar EN VIVO: el composer
// persiste cada movimiento de slider, y `storage` avisa a las demás pestañas del
// origen. Volver a la pestaña (visibilitychange) o a la ventana (focus) repesca lo
// que ese evento no cubra; el diff evita re-sortear 30 caras cuando no cambió nada.
window.addEventListener('storage', (e) => {
  if (e.key === 'doodle-bands:compose' && !estiloEl.value) applyEstilo()
})
const repescar = () => {
  if (estiloEl.value) return
  if (JSON.stringify(composerBands()) !== JSON.stringify(bands)) applyEstilo()
}
document.addEventListener('visibilitychange', repescar)
window.addEventListener('focus', repescar)

const fallback = getPalette('magenta')
// El aislamiento de cada cara vive AQUÍ, dentro del dibujo: 7% de margen por lado, en
// unidades lógicas, así que escala con la celda y aguanta cualquier ancho de pantalla.
// Nada de fiarlo al CSS.
const frame = box(LOGICAL * 0.07, LOGICAL * 0.07, LOGICAL * 0.86, LOGICAL * 0.86)
const gridEl = document.getElementById('grid')
const actors = []

// --- seeds guardados: la lista vive en localStorage, «copiar» la exporta ----
//
// Formato: "seed" a secas, o "seed:voiceSeed" cuando la voz se ha re-sorteado aparte.
// Las dos se leen; solo se escribe la larga cuando hace falta, para que una lista de
// caras sin tocar la voz siga siendo lo que era y se pueda seguir pegando a mano.
const SAVED_KEY = 'doodle-seeds:saved'
let savedSeeds = []
try {
  // Se normaliza al leer: una lista vieja (solo caras) y una nueva (con voz) conviven, y
  // `leerClave` deja las dos en la misma forma para lo que venga después.
  savedSeeds = (JSON.parse(localStorage.getItem(SAVED_KEY) || '[]') || [])
    .map((x) => String(x))
    .filter((x) => Number.isFinite(leerClave(x).seed))
} catch {}
const savedBtn = document.getElementById('saved')

/** Cómo se guarda este personaje. */
const clave = (a) =>
  a.voiceSeed === a.seed
    ? a.seed.toString(16)
    : `${a.seed.toString(16)}:${a.voiceSeed.toString(16)}`

/** Lo contrario: "1f2:9ab" → { seed, voiceSeed }. Una clave sin `:` es voz = cara. */
function leerClave(txt) {
  const [s, v] = String(txt).split(':')
  const seed = parseInt(s, 16)
  return { seed, voiceSeed: v === undefined ? seed : parseInt(v, 16) }
}

function syncSaved() {
  localStorage.setItem(SAVED_KEY, JSON.stringify(savedSeeds))
  savedBtn.textContent = `guardados: ${savedSeeds.length} · copiar`
}

savedBtn.addEventListener('click', async () => {
  await navigator.clipboard.writeText(JSON.stringify(savedSeeds))
  savedBtn.textContent = `guardados: ${savedSeeds.length} · copiado ✓`
  setTimeout(syncSaved, 900)
})

for (let i = 0; i < COUNT; i++) {
  const cell = document.createElement('div')
  cell.className = 'cell'
  const canvas = document.createElement('canvas')
  const tag = document.createElement('b')
  const fav = document.createElement('button')
  fav.className = 'fav'
  fav.textContent = '★'
  // Re-sortear sale del click en la celda y pasa a su propio botón: el click ahora es de
  // quien mira, no del generador. Con las dos cosas en el mismo gesto no se puede
  // reaccionar sin destruir al personaje al que estabas reaccionando.
  const again = document.createElement('button')
  again.className = 'again'
  again.textContent = '↻'
  again.title = 'otra seed para este'
  // La voz se re-sortea SOLA, sin tocar la cara. Con una sola seed, buscarle voz a un
  // personaje obligaba a tirar la cara que ya te gustaba.
  const voz = document.createElement('button')
  voz.className = 'voz'
  voz.textContent = '♪'
  voz.title = 'otra voz para esta cara'
  cell.append(canvas, tag, voz, again, fav)
  gridEl.append(cell)

  const a = makeActor(randomSeed(), { canvas, tag, fav, ctx: setupCanvas(canvas, CELL) })
  a.voiceSeed = a.seed
  a.idx = i // su sitio en la rejilla, para poder pedir el centro de su celda
  // setupCanvas deja width/height inline en px FIJOS (lo que necesitan las previews);
  // aquí manda la columna del grid: el canvas fluye como una imagen y el cuadrado lo
  // pone su ratio intrínseco. Sin esto, columnas < CELL px = canvases pisándose.
  canvas.style.width = '100%'
  canvas.style.height = 'auto'
  reseed(a, a.seed)

  // Las reacciones. El host dice QUÉ pasa; qué cara pone el personaje lo decide el rig.
  cell.addEventListener('pointerenter', () => react(a, 'atención', rig.now()))
  cell.addEventListener('pointerleave', () => react(a, 'neutro', rig.now()))
  cell.addEventListener('click', () => {
    const t = rig.now()
    // el sorteo va con el rng del actor: dos personajes no reaccionan igual al mismo
    // click, y el mismo personaje no siempre igual
    react(a, a.rng.next() < 0.5 ? 'sorpresa' : 'alegría', t)
    hablar(a)
    // y los vecinos se giran a mirar. La caducidad la lleva el rig (`gazeHold`), que es
    // quien tiene reloj: el host no tiene tic propio con el que soltarlos.
    const c = centrosDeCelda()
    lookAtAll(actors, c, c[i], t, { except: i, reach: GAZE_REACH, radius: CORO_RADIUS })
  })

  again.addEventListener('click', (e) => {
    e.stopPropagation() // re-sortear no es reaccionar
    reseed(a, randomSeed())
  })
  voz.addEventListener('click', (e) => {
    e.stopPropagation()
    revoice(a, randomSeed())
  })
  fav.addEventListener('click', (e) => {
    e.stopPropagation() // que guardar no dispare la reacción del click
    const c = clave(a)
    savedSeeds = savedSeeds.includes(c) ? savedSeeds.filter((s) => s !== c) : [...savedSeeds, c]
    fav.classList.toggle('on', savedSeeds.includes(c))
    syncSaved()
  })
  actors.push(a)
}
syncSaved()

function reseed(a, seed) {
  a.seed = seed
  a.voiceSeed = seed
  a.character = makeCharacter(seed, bands, null, { voiceSeed: seed })
  a.palette = paletteFor(a.character, fallback)
  a.tag.textContent = seed.toString(16)
  if (a.fav) a.fav.classList.toggle('on', savedSeeds.includes(clave(a)))
  a.drawn = null // fuerza el repintado en el próximo frame
  a.layout = null // ...y tira la caché de capas estáticas: son de ESTE personaje
  a.hasBase = false
  a.smokeTip = null
  a.speech = null // y deja de mover la boca: esa frase era del anterior
}

/**
 * Otra voz para la misma cara. NO se tira la caché de capas estáticas ni se marca el
 * repintado: con la misma seed y las mismas bandas, todo lo que se dibuja sale igual —
 * `voice` es la única clave del personaje que cambia.
 */
function revoice(a, voiceSeed) {
  a.voiceSeed = voiceSeed
  a.character = makeCharacter(a.seed, bands, null, { voiceSeed })
  turnos.delete(clave(a)) // otra voz, otro turno: se empieza por la frase 0
  if (a.fav) a.fav.classList.toggle('on', savedSeeds.includes(clave(a)))
  hablar(a)
}

let repaints = 0

// DOS offscreen por personaje, y cada uno amortiza una cosa distinta:
//
//   · `stat` — capas 0–4 (melena, orejas, cabeza, hatching, re-trazo). No dependen de
//     ningún canal del rig, así que se pintan UNA vez por personaje. Es lo caro del
//     dibujo: `hatch` crea un canvas, le aplica un blur por `filter` y lee getImageData
//     en cada llamada, hasta dos por cara — y hasta ahora eso se re-ejecutaba entero en
//     cada parpadeo (auditoría §4). Se invalida en `reseed`, que es lo único que cambia
//     el personaje o sus bandas.
//   · `base` — la cara completa. Es lo que hace barato el humo: en su tic (25fps) no se
//     redibuja nada, se re-blitea la base y se traza una línea encima.
//
// El acabado (grano y viñeta) se pinta con blend modes, y Chrome los resuelve con una
// diferencia de unas pocas unidades sobre un canvas que ha recibido un blit frente a uno
// pintado del tirón. Es invisible —es ruido sobre ruido— pero hace que el grano del
// index no sea byte a byte el de compose. Sin acabado, el blit es exacto.
function ensureLayers(a) {
  if (a.base) return
  const s = a.ctx._baseScale
  for (const [nombre, ctxName] of [['stat', 'sctx'], ['base', 'bctx']]) {
    const c = document.createElement('canvas')
    c.width = a.canvas.width
    c.height = a.canvas.height
    a[nombre] = c
    a[ctxName] = c.getContext('2d')
    a[ctxName].setTransform(s, 0, 0, s, 0, 0)
    a[ctxName]._baseScale = s
  }
}

/** Copia un offscreen entero, en píxeles de dispositivo: sin escalar, sin resamplear. */
function blit(ctx, src) {
  ctx.save()
  ctx.setTransform(1, 0, 0, 1, 0, 0)
  ctx.drawImage(src, 0, 0)
  ctx.restore()
}

// El golpe de escala de las reacciones. Escala el DIBUJO dentro del canvas — el DOM no se
// toca: mover las celdas volvería a la flotación que se quitó por solaparlas entre sí.
//
// El centro es la BASE del marco, o sea la barbilla: escalar desde el centro del lienzo
// hunde y levanta la cabeza a la vez y se lee como un zoom; desde la barbilla, el
// personaje crece hacia arriba, que es lo que hace un cuerpo que se sobresalta.
//
// Se aplica a las dos capas con la MISMA transformación, así que la estática se resamplea
// (es un bitmap) y la viva se dibuja vectorial ya escalada. Durante los ~250 ms del golpe
// esa mezcla no se nota; hacerlo al revés —escalar el blit final— emborronaría la cara
// entera, que es justo lo que se ve.
const BOUNCE_PIVOT = { x: frame.cx, y: frame.bottom }

function conBounce(ctx, b, dibujar) {
  if (!b) return dibujar()
  ctx.save()
  ctx.translate(BOUNCE_PIVOT.x, BOUNCE_PIVOT.y)
  ctx.scale(1 + b, 1 + b)
  ctx.translate(-BOUNCE_PIVOT.x, -BOUNCE_PIVOT.y)
  dibujar()
  ctx.restore()
}

function redraw(a, t = 0, faceChanged = true) {
  repescarMirada(a)
  ensureLayers(a)
  if (!a.layout) {
    clear(a.sctx, a.palette.bg)
    a.layout = drawStatic(a.sctx, frame, a.character, a.palette)
  }
  if (faceChanged || !a.hasBase) {
    repaints++
    const b = a.bounce
    // Con el rebote la escala baja de 1 y el dibujo deja de cubrir los bordes: hay que
    // limpiar antes o se quedan asomando los píxeles del frame anterior.
    if (b) clear(a.bctx, a.palette.bg)
    let r
    conBounce(a.bctx, b, () => {
      if (b) a.bctx.drawImage(a.stat, 0, 0, LOGICAL, LOGICAL)
      else blit(a.bctx, a.stat)
      r = drawLive(a.bctx, frame, a.character, a.palette, overridesFor(a), a.layout)
    })
    a.smokeTip = r.mouthGeo?.smoke || null
    a.hasBase = true
  }
  blit(a.ctx, a.base)
  // El humo va con la misma transformación: `drawLive` devuelve la punta del cigarro en
  // coordenadas lógicas SIN escalar (la escala es del rasterizado, no de la geometría),
  // así que sin esto la voluta se despegaría del cigarro durante el golpe.
  if (a.smokeTip) conBounce(a.ctx, a.bounce, () => drawSmoke(a.ctx, a.smokeTip, t, a.palette, a.smokePhase))
}

// --- la mirada sigue al puntero --------------------------------------------
// El rig no sabe que existe un ratón: solo sabe seguir un objetivo en [−1, 1]. Quien
// traduce píxeles a eso es el host, aquí.
//
// La distancia de referencia es lo que hace que el coro se lea como coro: con 500 px, las
// caras de alrededor del puntero se giran del todo y las del otro extremo de la pantalla
// apenas, así que se nota de dónde viene la atención. Con un normalizado por celda, las
// treinta mirarían igual de fuerte y no señalaría nadie.
//
// La vertical NO se recorta aquí. La tentación es hacerlo —un ojo sube y baja mucho menos
// de lo que gira— pero eso ya lo impone la geometría del ojo, que es cuatro veces más
// ancho que hondo: medido, la pupila recorre 112 px lógicos de lado a lado y 33 de arriba
// abajo. Recortar la `y` a la mitad encima de eso dejaba el eje vertical en 15 contra 112,
// y el movimiento no se leía.
const GAZE_REACH = 500
// Hasta dónde llega el coro. Es lo que lo hace un coro y no una coreografía: con los
// treinta girando a la vez se lee como un efecto, no como que alguien ha llamado la
// atención. Con 700 px se giran los vecinos y el resto sigue a lo suyo.
const CORO_RADIUS = 700
const clamp1 = (v) => (v < -1 ? -1 : v > 1 ? 1 : v)

// Los centros de celda se cachean: `getBoundingClientRect` fuerza layout, y a treinta por
// evento de puntero eso es tirar el frame. Solo cambian al redimensionar o al hacer
// scroll, que es cuando se invalidan.
// El último sitio donde se vio el puntero. Hace falta porque el reparto de miradas solo
// ocurre en `pointermove`: sin esto, cuando el coro suelta a un vecino (900 ms mirando a
// quien recibió el click), ese vecino se iba al vagabundeo aunque el ratón siguiera
// quieto encima de la página. Un ratón inmóvil dejaba de ser mirado por haber hecho click
// cerca.
let ultimoPuntero = null

let centros = null
const invalidarCentros = () => { centros = null }
window.addEventListener('resize', invalidarCentros)
window.addEventListener('scroll', invalidarCentros, { passive: true })

function centrosDeCelda() {
  if (!centros) {
    centros = actors.map((a) => {
      const r = a.canvas.getBoundingClientRect()
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 }
    })
  }
  return centros
}

// El coro tiene prioridad sobre el puntero mientras dura: el reparto se hace en cada
// pointermove, y sin el candado mover el ratón un píxel lo borraría antes de verse.
function mirarA(puntero) {
  ultimoPuntero = puntero
  const c = puntero && centrosDeCelda()
  for (let i = 0; i < actors.length; i++) {
    if (actors[i].gazeHold !== null) continue
    actors[i].gazeTarget = puntero ? objetivoDe(i, puntero, c) : null
  }
}

const objetivoDe = (i, puntero, c = centrosDeCelda()) => ({
  x: clamp1((puntero.x - c[i].x) / GAZE_REACH),
  y: clamp1((puntero.y - c[i].y) / GAZE_REACH),
})

/**
 * Devolverle el puntero a un actor al que el coro acaba de soltar.
 *
 * Va colgado del repintado y no de un temporizador porque el host no tiene tic propio: el
 * único momento en que ve a un actor concreto es cuando el rig le pide dibujarlo. Y la
 * caducidad del coro la lleva el rig, en SU reloj — un `setTimeout` se dispararía a
 * destiempo con la animación pausada. Es barato: solo entra cuando el actor no mira a
 * ningún sitio, que es justo el frame siguiente al vencimiento.
 */
function repescarMirada(a) {
  if (!ultimoPuntero || a.gazeHold !== null || a.gazeTarget !== null) return
  a.gazeTarget = objetivoDe(a.idx, ultimoPuntero)
}

window.addEventListener('pointermove', (e) => mirarA({ x: e.clientX, y: e.clientY }))
// Fuera de la ventana no hay a dónde mirar: se sueltan los treinta y vuelven a su
// vagabundeo. `pointerleave` no burbujea, así que va en el <html>, no en window.
document.documentElement.addEventListener('pointerleave', () => mirarA(null))
window.addEventListener('blur', () => mirarA(null))

// --- voz --------------------------------------------------------------------
// El AudioContext se crea en el PRIMER click y se reutiliza. No al cargar: los
// navegadores no dejan sonar uno que no venga de un gesto, y se quedaría mudo sin decir
// por qué. Con el sonido apagado no se crea ninguno — quien lo tiene en «no» no tiene por
// qué estrenar el audio de su navegador para nada.
const SONIDO_KEY = 'doodle-sonido:index'
let silencio = localStorage.getItem(SONIDO_KEY) === 'off'
let speech = null

function motor() {
  if (!speech) {
    const ctx = new (window.AudioContext || window.webkitAudioContext)()
    speech = createSpeech(ctx)
    speech.ctx = ctx
  }
  if (speech.ctx.state === 'suspended') speech.ctx.resume()
  speech.setMuted(silencio)
  return speech
}

// El turno de cada personaje: la frase 0, la 1, la 2… Va por seed, así que un personaje
// re-sorteado empieza de cero y el mismo seed dice siempre lo mismo en el mismo turno.
const turnos = new Map()

function hablar(a) {
  const c = clave(a)
  const k = turnos.get(c) ?? 0
  turnos.set(c, k + 1)
  // La frase cuelga de la seed de VOZ, no de la de la cara: si no, cambiar de voz
  // dejaría al personaje diciendo exactamente lo mismo con otro timbre.
  const frase = phrase(a.character.voice, makeRng(a.voiceSeed).fork(SALT.voice).fork(k))
  // La boca va aunque no se oiga: silenciar es bajar el volumen, no dejar de hablar.
  a.speech = { t0: rig.now(), phrase: frase }
  if (silencio && !speech) return
  motor().speak(a.character.voice, frase, a.voiceSeed)
}

const sonidoBtn = document.getElementById('sonido')
const syncSonido = () => (sonidoBtn.textContent = `sonido: ${silencio ? 'no' : 'sí'}`)
syncSonido()
sonidoBtn.addEventListener('click', () => {
  silencio = !silencio
  localStorage.setItem(SONIDO_KEY, silencio ? 'off' : 'on')
  syncSonido()
  if (speech) speech.setMuted(silencio)
})

const rig = startRig(actors, redraw)

// para poder inspeccionar y gobernar la animación desde consola
window.__rig = { actors, redraw, frame, rig, mirarA }

document.getElementById('regen').addEventListener('click', () => {
  for (const a of actors) reseed(a, randomSeed())
})

// Pausar y reanudar es del RIG, no un stop + arranque nuevo: su reloj se congela y
// continúa donde se quedó. Con el reloj del navegador, veinte segundos de pausa dejaban
// todas las citas vencidas y los treinta parpadeaban a coro al volver (auditoría §5).
const pauseBtn = document.getElementById('pause')
pauseBtn.addEventListener('click', () => {
  if (rig.running()) rig.pause()
  else rig.resume()
  pauseBtn.textContent = rig.running() ? 'pausar' : 'reanudar'
})

// --- fps + cuántas caras se repintan por frame --------------------------
// El segundo número es el que importa: si sube a 30, el ahorro de no repintar lo
// que no cambia se ha perdido.
const fpsEl = document.getElementById('fps')
if (DEV) {
  let frames = 0
  setInterval(() => {
    fpsEl.textContent = `${frames} fps · ${(repaints / Math.max(1, frames)).toFixed(1)} caras repintadas por frame`
    frames = 0
    repaints = 0
  }, 1000)
  ;(function tickFps() {
    frames++
    requestAnimationFrame(tickFps)
  })()
} else {
  // Fuera del taller no es que se esconda: es que no existe. Dejarlo contando sería un
  // segundo rAF corriendo para siempre a cambio de escribir en un nodo que nadie ve.
  fpsEl.remove()
}
</script>
