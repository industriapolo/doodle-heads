<!doctype html>
<meta charset="utf-8">
<script type="module">
// LABORATORIO — construcción nueva del ojo, aislada. No toca eyes.js.
//
// El esquema:
//   1. el blanco es el segmento circular de siempre (cuerda recta + arco)
//   2. se le superpone una ELIPSE más estrecha que la cuerda
//   3. copia A, recortada CONTRA el ojo -> pliegue arriba y ojera abajo
//   4. copia B, recortada CON el ojo    -> los trozos de dentro, que cierran comisuras
//
// Las dos copias son la MISMA elipse: mover una mueve las dos.
//
// El cierre es UN solo canal. Antes había dos que hacían lo mismo por caminos
// distintos — bajar la cuerda o subir el arco — y los dos colapsaban el blanco a cero.
// Ahora `blink` cierra y `blinkPivot` decide hacia dónde: 0 arriba, 1 abajo.

import { mountPreview } from './_template.js'
import { interior } from '../src/style/stroke.js'
import { sample } from '../src/core/params.js'

const PARAMS = {
  construccion: { options: ['no', 'si'], pool: { no: 1, si: 0 }, label: 'Ver la elipse entera' },

  eyeWidth: { min: 0.10, max: 0.70, range: [0.30, 0.30], step: 0.005, label: 'Ancho (cuerda)' },
  depth:    { min: 0.01, max: 0.14, range: [0.055, 0.055], step: 0.002, label: 'Apertura (flecha)' },
  tilt:     { min: -18, max: 18, range: [0, 0], step: 0.5, unit: '°', label: 'Inclinación' },
  spacing:  { min: 0.01, max: 0.34, range: [0.14, 0.14], step: 0.01, label: 'Separación' },

  // CONDICIÓN DEL RECORTE LATERAL: el punto más ancho de la elipse tiene que caer
  // dentro del blanco. `ringRx` < 1 deja además asomar la cuerda por las comisuras.
  ringRx: { min: 0.4, max: 1.15, range: [0.72, 0.72], step: 0.01, label: 'Radio horizontal (× media cuerda)' },
  ringRy: { min: 0.2, max: 1.6, range: [0.48, 0.48], step: 0.01, label: 'Radio vertical (× media cuerda)' },
  ringCy: { min: -1.5, max: 3, range: [0.28, 0.28], step: 0.02, label: 'Centro Y (× flecha)' },
  gapAngle: { min: 0, max: 70, range: [30, 30], step: 1, unit: '°', label: 'Apertura del hueco' },
  interior: { options: ['si', 'no'], pool: { si: 1, no: 0 }, label: 'Copia interior' },

  // El blanco solo ocupa el area CENTRAL, la que delimitan los costados de la elipse.
  // Las comisuras que quedan fuera van en tono de sombra de cara.
  cornerShade: { options: ['si', 'no'], pool: { si: 1, no: 0 }, label: 'Comisuras en sombra' },
  cornerTone: {
    options: ['propio', 'media', 'fuerte'],
    pool: { propio: 1, media: 0, fuerte: 0 },
    label: 'Tono de las comisuras',
  },

  bagLines: { min: 0, max: 3, range: [1, 1], step: 1, int: true, label: 'Bolsas concéntricas extra' },
  bagStep:  { min: 0.02, max: 0.5, range: [0.12, 0.12], step: 0.01, label: 'Paso entre concéntricas' },

  // La sombra usa las MISMAS elipses, rellenas en vez de trazadas: así queda ligada al
  // resto de la construcción y no puede descuadrarse al mover un radio.
  // No sale siempre — es una probabilidad, como el cigarrillo.
  shadow:     { type: 'bool', p: 0.35, label: 'Probabilidad de sombra' },
  shadowRing: { min: 0, max: 3, range: [1, 1], step: 1, int: true, label: 'Anillo que la limita' },
  shadowTone: { options: ['media', 'fuerte'], pool: { media: 1, fuerte: 0 }, label: 'Tono' },

  pupilSize: { min: 0.02, max: 0.3, range: [0.12, 0.12], step: 0.005, label: 'Tamaño pupila' },
  pupilX:    { min: -1, max: 1, range: [0, 0], step: 0.05, label: 'Mirada X' },

  // Un canal de cierre, no dos.
  blink:      { min: 0, max: 1, range: [0, 0], step: 0.01, label: 'Cierre' },
  blinkPivot: { min: 0, max: 1, range: [0, 0], step: 0.05, label: 'Hacia dónde cierra (0 arriba / 1 abajo)' },

  lineWeight:   { min: 0.5, max: 12, range: [4.1, 4.1], step: 0.1, label: 'Grosor del ojo' },
  detailWeight: { min: 0.5, max: 12, range: [3.2, 3.2], step: 0.1, label: 'Grosor de los arcos' },
}

/** Segmento circular: cuerda en y=0 de largo w, arco de flecha `sag` hacia abajo. */
function segment(w, sag) {
  const half = w / 2
  const R = (sag * sag + half * half) / (2 * sag)
  const cy = -(R - sag)
  const path = new Path2D()
  path.moveTo(-half, 0)
  path.arc(0, cy, R, Math.atan2(R - sag, -half), Math.atan2(R - sag, half), true)
  return path
}

const sealed = (open) => {
  const p = new Path2D()
  p.addPath(open)
  p.closePath()
  return p
}

/** El complemento de un path: todo menos él. Con evenodd, un rect enorme + el path. */
function outside(path) {
  const o = new Path2D()
  o.rect(-4000, -4000, 8000, 8000)
  o.addPath(path)
  return o
}

function eye(ctx, cx, cy, p, palette, frame) {
  const w = frame.w * p.eyeWidth
  const half = w / 2
  const sag = frame.h * p.depth

  // Un cierre, dos formas de cerrar. La cuerda y el arco convergen los dos hacia la
  // misma altura `m`: con pivot 0 el arco sube hasta la cuerda (el ojo acaba en una
  // recta a lo ancho completo), con pivot 1 la cuerda baja hasta el arco.
  const t = p.blink
  const m = sag * p.blinkPivot
  const chordY = t * m
  const sagNow = Math.max(0.6, sag * (1 - t)) // 0 exacto degenera el radio del arco

  ctx.save()
  ctx.translate(cx, cy)
  ctx.rotate((p.tilt * Math.PI) / 180)

  const rest = sealed(segment(w, sag)) // forma en REPOSO: la que manda en el recorte
  const nowOpen = segment(w, sagNow)
  const now = sealed(nowOpen)

  const rx = half * p.ringRx
  const ry = half * p.ringRy
  const ecy = sag * p.ringCy

  // --- sombra: la misma elipse, rellena ------------------------------------
  // Va la PRIMERA de todo, porque está sobre la piel y todo lo demás se pinta encima.
  // Solo por debajo de la cuerda: en la referencia la zona entre cuerda y pliegue queda
  // limpia. Y recortada contra la forma en REPOSO, así no se mueve al parpadear.
  if (p.shadow) {
    const k = 1 + p.shadowRing * p.bagStep
    ctx.save()
    ctx.clip(outside(rest), 'evenodd')
    const debajo = new Path2D()
    debajo.rect(-4000, 0, 8000, 4000)
    ctx.clip(debajo)
    const mancha = new Path2D()
    mancha.ellipse(0, ecy, rx * k, ry * k, 0, 0, Math.PI * 2)
    ctx.fillStyle = p.shadowTone === 'fuerte' ? palette.skinDeep : palette.skinShadow
    ctx.fill(mancha)
    ctx.restore()
  }

  // --- blanco + pupila ----------------------------------------------------
  // El blanco NO llena el segmento de comisura a comisura: solo el área central, la
  // que delimitan los costados de la elipse. Lo de fuera va en tono de sombra.
  // Se pinta en dos pasadas — todo en sombra, y encima el blanco recortado a la
  // elipse — porque la elipse ya es quien parte el ojo en tres: las líneas que separan
  // las zonas son las de la copia interior, así que coinciden solas.
  const blanco = p.sclera === 'accent' ? palette.accent : palette.accent2
  ctx.save()
  ctx.translate(0, chordY)
  ctx.clip(now)

  const tonoComisura = { propio: palette.eyeCorner, media: palette.skinShadow, fuerte: palette.skinDeep }
  ctx.fillStyle = p.cornerShade === 'si' ? tonoComisura[p.cornerTone] : blanco
  ctx.fillRect(-w, -sag * 4, w * 2, sag * 8)

  if (p.cornerShade === 'si') {
    ctx.save()
    ctx.translate(0, -chordY) // la elipse vive en el marco sin desplazar
    const centro = new Path2D()
    centro.ellipse(0, ecy, rx, ry, 0, 0, Math.PI * 2)
    ctx.fillStyle = blanco
    ctx.fill(centro)
    ctx.restore()
  }

  const pr = (w * p.pupilSize) / 2
  ctx.fillStyle = palette.line
  ctx.beginPath()
  ctx.arc(p.pupilX * (half - pr * 2.2), pr * 0.45, pr, 0, Math.PI * 2)
  ctx.fill()
  ctx.restore()

  if (p.construccion === 'si') {
    ctx.save()
    ctx.strokeStyle = palette.accent
    ctx.lineWidth = 1.5
    ctx.setLineDash([6, 5])
    for (let i = 0; i <= p.bagLines; i++) {
      const k = 1 + i * p.bagStep
      const g = new Path2D()
      g.ellipse(0, ecy, rx * k, ry * k, 0, 0, Math.PI * 2)
      ctx.stroke(g)
    }
    ctx.restore()
  }

  // --- copia A: recortada CONTRA el ojo -----------------------------------
  // Contra la forma en REPOSO, no la actual: si se recortara contra la actual, al
  // cerrarse no quedaría nada que recortar y saldría el aro entero rodeando un ojo
  // cerrado. Además el pliegue y la ojera no se mueven al parpadear.
  //
  // Dos recortes que se suman: el angular decide el hueco y es un número que pides;
  // el de intersección garantiza que nada cruce por dentro del blanco.
  const gap = (p.gapAngle * Math.PI) / 180
  interior(ctx, palette, p.detailWeight)
  for (let i = 0; i <= p.bagLines; i++) {
    const k = 1 + i * p.bagStep
    ctx.save()
    ctx.clip(outside(rest), 'evenodd')

    // Cada arco en su propio Path2D: en el mismo, el segundo arrastraría una recta
    // desde donde acabó el primero.
    const abajo = new Path2D()
    abajo.ellipse(0, ecy, rx * k, ry * k, 0, gap, Math.PI - gap)
    ctx.stroke(abajo)

    if (i === 0) {
      // el pliegue, solo en la primera: si no, se acumulan pliegues sobre el ojo
      const arriba = new Path2D()
      arriba.ellipse(0, ecy, rx * k, ry * k, 0, Math.PI + gap, Math.PI * 2 - gap)
      ctx.stroke(arriba)
    }
    ctx.restore()
  }

  // --- copia B: la MISMA elipse recortada CON el ojo ----------------------
  // Cierra las comisuras por dentro. Sin recorte angular: aquí interesa justo lo que
  // deje la intersección. Y contra el blanco VISIBLE, no el de reposo — es un rasgo
  // sobre el globo, así que se va con el párpado.
  if (p.interior === 'si') {
    ctx.save()
    ctx.translate(0, chordY)
    ctx.clip(now)
    ctx.translate(0, -chordY)
    const dentro = new Path2D()
    dentro.ellipse(0, ecy, rx, ry, 0, 0, Math.PI * 2)
    interior(ctx, palette, p.detailWeight)
    ctx.stroke(dentro)
    ctx.restore()
  }

  // --- las dos líneas del ojo, encima -------------------------------------
  ctx.save()
  ctx.translate(0, chordY)
  interior(ctx, palette, p.lineWeight)
  ctx.stroke(nowOpen) // arco inferior
  const chord = new Path2D()
  chord.moveTo(-half, 0)
  chord.lineTo(half, 0)
  ctx.stroke(chord)
  ctx.restore()

  ctx.restore()

  // Con recorte angular el aro no puede cerrarse, así que el aviso solo aplica cuando
  // el hueco se deja a cero y todo depende de la intersección.
  const R = (sag * sag + half * half) / (2 * sag)
  const arcYAt = (x) => Math.sqrt(Math.max(0, R * R - x * x)) - (R - sag)
  return p.gapAngle > 3 || ecy < arcYAt(rx)
}

mountPreview({
  title: 'eye-lab',
  groups: [{ name: 'eye', params: PARAMS }],
  draw(ctx, frame, bands, palette, rng) {
    const p = sample(PARAMS, rng, bands.eye)
    ctx.fillStyle = palette.skin
    ctx.fillRect(frame.x, frame.y, frame.w, frame.h)
    const gap = frame.w * p.spacing
    const w = frame.w * p.eyeWidth
    eye(ctx, frame.cx - gap / 2 - w / 2, frame.cy, p, palette, frame)
    const corta = eye(ctx, frame.cx + gap / 2 + w / 2, frame.cy, p, palette, frame)

    if (!corta) {
      ctx.fillStyle = '#E5117F'
      ctx.font = 'bold 26px ui-monospace, monospace'
      ctx.fillText('aro cerrado — costados sin cortar', frame.x + 16, frame.bottom - 20)
    }
  },
  cols: 3,
  rows: 2,
  cell: 300,
  inset: 0.02,
  refs: [
    '../referencias/tumblr_nk2zjbwVVF1qbb5vqo1_1280.jpg',
    '../referencias/tumblr_nn95pohTcC1qbb5vqo1_1280.jpg',
  ],
})
</script>
