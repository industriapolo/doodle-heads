<!doctype html>
<meta charset="utf-8">
<script type="module">
import { mountPreview } from './_template.js'
import { makeCharacter, draw } from '../src/core/character.js'
import * as head from '../src/parts/head.js'
import * as ears from '../src/parts/ears.js'
import * as hair from '../src/parts/hair.js'
import * as brows from '../src/parts/brows.js'
import * as eyes from '../src/parts/eyes.js'
import * as nose from '../src/parts/nose.js'
import * as mouth from '../src/parts/mouth.js'
import * as chin from '../src/parts/chin.js'

const without = (params, ...drop) =>
  Object.fromEntries(Object.entries(params).filter(([k]) => !drop.includes(k)))

// Los grosores de trazo se sacan de sus bloques y se juntan en una sección propia:
// se ajustan comparándolos entre sí, no dentro de la parte a la que pertenecen.
// El nombre cualificado "modulo.param" le dice al panel a qué módulo escribe cada uno.
const pick = (mod, key, label) => ({ ...mod.PARAMS[key], label })

const WEIGHTS = {
  'head.lineWeight': pick(head, 'lineWeight', 'Contorno de la cabeza'),
  'ears.lineWeight': pick(ears, 'lineWeight', 'Contorno de la oreja'),
  'eyes.lineWeight': pick(eyes, 'lineWeight', 'Ojo'),
  'eyes.detailWeight': pick(eyes, 'detailWeight', 'Detalles del ojo'),
  'nose.lineWeight': pick(nose, 'lineWeight', 'Nariz'),
  'mouth.lineWeight': pick(mouth, 'lineWeight', 'Boca'),
  'chin.lineWeight': pick(chin, 'lineWeight', 'Hoyuelo de barbilla'),
  'hair.hairWeight': pick(hair, 'hairWeight', 'Rayita del pelo'),
  'hair.beardWeight': pick(hair, 'beardWeight', 'Rayita de la barba'),
}

// Todas las variables del personaje en un panel, agrupadas por parte.
// El orden es el de las capas, para que el panel se lea como se dibuja.
mountPreview({
  title: 'compose',
  groups: [
    { name: 'weights', label: 'Grosores de trazo', params: WEIGHTS },
    { name: 'head',  label: 'Cabeza', params: without(head.PARAMS, 'lineWeight') },
    // dos bloques, un solo módulo: el pelo y la barba se dirigen por separado
    { name: 'hair',  label: 'Pelo', params: without(hair.HAIR_PARAMS, 'hairWeight') },
    { name: 'beard', label: 'Barba', params: without(hair.BEARD_PARAMS, 'beardWeight'), bandKey: 'hair' },
    { name: 'brows', label: 'Cejas', params: brows.PARAMS },
    { name: 'eyes',  label: 'Ojos', params: without(eyes.PARAMS, 'lineWeight', 'detailWeight') },
    { name: 'nose',  label: 'Nariz', params: without(nose.PARAMS, 'lineWeight') },
    { name: 'mouth', label: 'Boca', params: without(mouth.PARAMS, 'lineWeight') },
    { name: 'chin',  label: 'Hoyuelo de barbilla', params: without(chin.PARAMS, 'lineWeight') },
    { name: 'ears',  label: 'Orejas', params: without(ears.PARAMS, 'lineWeight') },
  ],
  draw(ctx, frame, bands, palette, rng, seed) {
    draw(ctx, frame, makeCharacter(seed, bands), palette)
  },
  inset: 0.06,
  refs: [
    '../referencias/tumblr_nk2zjbwVVF1qbb5vqo1_1280.jpg',
    '../referencias/tumblr_nmww44tSk81qbb5vqo1_1280.jpg',
    '../referencias/tumblr_nn95pohTcC1qbb5vqo1_1280.jpg',
    '../referencias/tumblr_n5m7rycInM1qbb5vqo1_1280.jpg',
  ],
})
</script>
