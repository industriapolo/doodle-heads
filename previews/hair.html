<!doctype html>
<meta charset="utf-8">
<script type="module">
import { mountPreview } from './_template.js'
import { CONFIGS } from './configs.js'
import { makeCharacter, draw, paletteFor } from '../src/core/character.js'
import * as head from '../src/parts/head.js'
import * as hair from '../src/parts/hair.js'
import * as palettes from '../src/style/palettes.js'
import * as archetypes from '../src/core/archetypes.js'

// Preview del PELO: personajes completos (el pelo no se puede juzgar sin cara debajo),
// pero el panel solo expone cabeza, pelo y barba. El resto de rasgos sale de sus bandas
// declaradas — ruido visual constante, variables bajo control.
mountPreview({
  title: 'hair',
  groups: [
    { name: 'arquetipo', label: 'Arquetipo', params: archetypes.PARAMS },
    { name: 'palette', label: 'Color', params: palettes.PARAMS },
    { name: 'head', label: 'Cabeza', params: head.PARAMS },
    { name: 'hair', label: 'Pelo', params: hair.HAIR_PARAMS },
    { name: 'beard', label: 'Barba', params: hair.BEARD_PARAMS, bandKey: 'hair' },
  ],
  paletteSelect: false,
  configs: CONFIGS,
  draw(ctx, frame, bands, fallback, rng, seed) {
    const character = makeCharacter(seed, bands)
    const pal = paletteFor(character, fallback)
    ctx.fillStyle = pal.bg
    ctx.fillRect(0, 0, 800, 800)
    draw(ctx, frame, character, pal)
  },
  inset: 0.06,
  refs: [
    '../referencias/tumblr_nk2zjbwVVF1qbb5vqo1_1280.jpg',
    '../referencias/tumblr_nmww44tSk81qbb5vqo1_1280.jpg',
    '../referencias/mujer-geisha.png',
    '../referencias/mujer-morada.png',
    '../referencias/mujer-fumadora.png',
    '../referencias/mujer-jeune-fille.png',
  ],
})
</script>
